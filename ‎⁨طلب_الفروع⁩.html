<style>
:root{--bg:#fff8f2;--card:#fff;--ink:#2a1a14;--muted:#7a6459;--line:#f3d9c4;--accent:#f03a1a;--brand:#f7931e;--ok:#2e7d32}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17150f;--card:#221f19;--ink:#f1ece4;--muted:#a79f95;--line:#3a352d;--accent:#ff6b52;--ok:#81c784}}
:root[data-theme="dark"]{--bg:#17150f;--card:#221f19;--ink:#f1ece4;--muted:#a79f95;--line:#3a352d;--accent:#ff6b52;--brand:#f7931e;--ok:#81c784}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:3px solid var(--brand);padding:10px 16px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.brand img{width:56px;height:56px;border-radius:50%}
.brand b{display:block;font-size:20px;color:var(--accent);letter-spacing:.5px}
.brand small{color:var(--muted);font-size:13px}
h1{font-size:18px;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=date],input[type=search],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
select,input[type=date],input[type=search]{flex:1;min-width:140px}
main{padding:12px 16px 120px;max-width:720px;margin:0 auto}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
summary{padding:12px 14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between}
summary span.cnt{color:var(--muted);font-weight:400;font-size:13px}
.item{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.item .nm{font-size:15px}
.item .un{color:var(--muted);font-size:12px}
.item.has{background:color-mix(in srgb,var(--brand) 14%,transparent)}
.qty{display:flex;align-items:center;gap:4px}
.qty input{width:100%;text-align:center;font-size:16px}
.qty button{font:inherit;width:34px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
footer .sum{flex:1;min-width:120px;font-size:14px;color:var(--muted)}
button.p{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:#fff;cursor:pointer}
button.s:hover,button.p:hover{filter:brightness(.95)}
button.s{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--bg);color:var(--ink);cursor:pointer}
.msg{position:fixed;bottom:76px;left:16px;right:16px;margin:auto;max-width:400px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;text-align:center;display:none}
.warn{background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
</style>
</head>

c": "ITEM-0244", "n": "رسوم نظافه هيثم", "u": "عدد", "k": "أخرى"}, {"c": "ITEM-0245", "n": "مغسله", "u": "عدد", "k": "أخرى"}, {"c": "ITEM-0246", "n": "اسعافات اوليه", "u": "عدد", "k": "أخرى"}, {"c": "ITEM-0247", "n": "وراك اصطف", "u": "كجم", "k": "أخرى"}, {"c": "ITEM-0248", "n": "ثلج", "u": "كيس", "k": "أخرى"}, {"c": "ITEM-0249", "n": "أكياس الشيف طاهر", "u": "كجم", "k": "أخرى"}, {"c": "ITEM-0250", "n": "None", "u": "", "k": "أخرى"}, {"c": "ITEM-0251", "n": "None", "u": "", "k": "أخرى"}];
const $ = id => document.getElementById(id);
const KEY = "re_order_draft_v1";

// ---- حفظ مسودة (try/catch لأن التخزين ممكن يكون مقفول)
function loadDraft(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function saveDraft(d){ try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} }

let draft = loadDraft();          // { branch, date, qty: { code: {q, n} } }
const params = new URLSearchParams(location.search);
const urlBranch = params.get("branch");
if (urlBranch) draft.branch = urlBranch;
if (!draft.qty) draft.qty = {};
if (!draft.date) draft.date = new Date().toISOString().slice(0,10);

$("branch").value = draft.branch || "";
$("date").value = draft.date;

// ---- بناء القائمة مجمّعة حسب الفئة
const list = $("list");
ITEMS.slice().sort((x, y) => x.c.localeCompare(y.c, "en", { numeric: true })).forEach(it => {
  const row = document.createElement("div");
  row.className = "item"; row.dataset.code = it.c;
  row.dataset.search = (it.n + " " + it.c).toLowerCase();
  row.innerHTML = `
    <div><div class="nm"></div><div class="un"></div></div>
    <div class="qty">
      <button type="button" data-d="-1" aria-label="ناقص">−</button>
      <input type="number" inputmode="decimal" min="0" step="any" placeholder="0" aria-label="الكمية">
      <button type="button" data-d="1" aria-label="زائد">+</button>
    </div>`;
  row.querySelector(".nm").textContent = it.n;
  row.querySelector(".un").textContent = it.c + " · " + (it.u || "");
  const inp = row.querySelector("input");
  const saved = draft.qty[it.c];
  if (saved && saved.q) { inp.value = saved.q; row.classList.add("has"); }
  inp.addEventListener("input", () => setQty(it, inp.value, row));
  row.querySelectorAll("button[data-d]").forEach(b => b.addEventListener("click", () => {
    const cur = parseFloat(inp.value) || 0;
    const nv = Math.max(0, +(cur + parseFloat(b.dataset.d)).toFixed(3));
    inp.value = nv || ""; setQty(it, inp.value, row);
  }));
  list.appendChild(row);
});

function setQty(it, v, row){
  const q = parseFloat(String(v).replace(",", "."));
  if (!q || q <= 0) { delete draft.qty[it.c]; row.classList.remove("has"); }
  else { draft.qty[it.c] = { q, n: it.n }; row.classList.add("has"); }
  saveDraft(draft); refresh();
}

function selected(){
  return ITEMS.filter(it => draft.qty[it.c] && draft.qty[it.c].q > 0)
              .map(it => ({ ...it, q: draft.qty[it.c].q }));
}

function refresh(){
  const sel = selected();
  $("sum").textContent = sel.length ? `${sel.length} صنف مختار` : "مفيش أصناف مختارة";
}

$("branch").addEventListener("change", e => { draft.branch = e.target.value; saveDraft(draft); $("warn").style.display = "none"; });
$("date").addEventListener("change", e => { draft.date = e.target.value; saveDraft(draft); });
$("q").addEventListener("input", e => {
  const t = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".item").forEach(r => r.style.display = (!t || r.dataset.search.includes(t)) ? "" : "none");
});
$("clr").addEventListener("click", () => {
  if (!confirm("نمسح كل الكميات؟")) return;
  draft.qty = {}; saveDraft(draft);
  document.querySelectorAll(".item input").forEach(i => i.value = "");
  document.querySelectorAll(".item.has").forEach(r => r.classList.remove("has"));
  refresh();
});

function fmtQ(q){ return String(+q.toFixed(3)).replace(".", ","); }

function buildText(){
  const sel = ITEMS.slice().sort((x, y) => x.c.localeCompare(y.c, "en", { numeric: true }))
                     .filter(it => draft.qty[it.c] && draft.qty[it.c].q > 0)
                     .map(it => ({ ...it, q: draft.qty[it.c].q }));
  let t = `طلب من فرع ${draft.branch} - ${draft.date}\n\n`;
  sel.forEach(it => { t += `- ${it.n}: ${fmtQ(it.q)} ${it.u}\n`; });
  t += `\nإجمالي الأصناف: ${sel.length}`;
  return t;
}

// نسخ صفوف جاهزة للصق في شيت "طلبات الفروع" أعمدة A-D: التاريخ | الفرع | الكود | الكمية
function buildTSV(){
  const sel = selected();
  return sel.map(it => [draft.date, draft.branch, it.c, String(+(it.q).toFixed(3))].join("\t")).join("\n");
}

function toast(t){ const m=$("msg"); m.textContent=t; m.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>m.style.display="none",2600); }

function needBranch(){
  if (!$("branch").value) { $("warn").style.display = "block"; $("branch").focus(); toast("اختار الفرع الأول"); return true; }
  return false;
}

$("copy").addEventListener("click", async () => {
  if (needBranch()) return;
  if (!selected().length) return toast("مفيش أصناف مختارة");
  const tsv = buildTSV();
  try { await navigator.clipboard.writeText(tsv); toast("اتنسخ — الصقه في شيت طلبات الفروع (A إلى D)"); }
  catch(e){ window.prompt("انسخ النص ده والصقه في الشيت:", tsv); }
});

const HKEY = "re_order_history_v1";
function loadHist(){ try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch(e){ return []; } }
function saveHist(h){ try { localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 60))); } catch(e){} }
function recordSent(){
  const h = loadHist();
  const lines = selected().map(it => ({ c: it.c, n: it.n, u: it.u, q: it.q }));
  h.unshift({ date: draft.date, branch: draft.branch, lines });
  saveHist(h); renderHist();
}
function renderHist(){
  const box = $("histList"); box.innerHTML = "";
  const h = loadHist();
  if (!h.length) { box.textContent = "مفيش طلبات متسجلة على الجهاز ده."; return; }
  h.forEach(o => {
    const d = document.createElement("div"); d.className = "item";
    const t = document.createElement("div");
    const a = document.createElement("div"); a.className = "nm"; a.textContent = `${o.branch} — ${o.date}`;
    const b = document.createElement("div"); b.className = "un"; b.textContent = `${o.lines.length} صنف`;
    t.appendChild(a); t.appendChild(b);
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "s"; btn.textContent = "نسخ للشيت";
    btn.addEventListener("click", async () => {
      const tsv = o.lines.map(l => [o.date, o.branch, l.c, String(+l.q.toFixed(3))].join("\t")).join("\n");
      try { await navigator.clipboard.writeText(tsv); toast("اتنسخ — الصقه في شيت طلبات الفروع"); }
      catch(e){ window.prompt("انسخ النص ده:", tsv); }
    });
    d.appendChild(t); d.appendChild(btn); box.appendChild(d);
  });
}

// ابعت الطلب: قائمة المشاركة في التليفون (تختار أي شات أو جروب)
$("send").addEventListener("click", async () => {
  if (needBranch()) return;
  if (!selected().length) return toast("مفيش أصناف مختارة");
  const text = buildText();
  if (navigator.share) {
    try { await navigator.share({ text }); recordSent(); return; }
    catch(e){ if (e && e.name === "AbortError") return; }   // المستخدم قفل القايمة بنفسه
  }
  // المشاركة مش متاحة هنا: نفتح واتساب ونختار الشات، ونسخ الرسالة احتياطي
  try { await navigator.clipboard.writeText(text); } catch(e){}
  const fb = $("fb");
  fb.href = `https://wa.me/?text=${encodeURIComponent(text)}`;
  fb.style.display = "block";
  fb.scrollIntoView({ behavior: "smooth", block: "center" });
  toast("اتنسخ الطلب — اضغط الزرار الأزرق عشان تفتح واتساب");
  recordSent();
});

// واتساب لرقمي بس
$("wa").addEventListener("click", () => {
  if (needBranch()) return;
  if (!selected().length) return toast("مفيش أصناف مختارة");
  if (!OWNER_PHONE) return toast("رقم الواتساب مش متحدد");
  window.open(`https://wa.me/${OWNER_PHONE}?text=${encodeURIComponent(buildText())}`, "_blank", "noopener");
  recordSent();
});

renderHist();
refresh();
$("branch").addEventListener("change", refresh);
</script>
</body>
